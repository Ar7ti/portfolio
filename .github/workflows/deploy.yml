name: Deploy

# Prod: every push to main runs `wrangler deploy`.
# Preview: every PR from this repo uploads a new Worker version with a `pr-<number>` alias
# and posts the preview URL as a PR comment.
# Until Kirill adds the CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID secrets (issue #6),
# the job only prints a notice and passes.

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  WRANGLER_VERSION: 4.158.0

jobs:
  deploy:
    name: ${{ github.event_name == 'push' && 'Production' || 'Preview' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # Secrets are not available to PRs from forks.
    if: github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository
    permissions:
      contents: read
      pull-requests: write
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - name: Check secrets
        id: secrets
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "::notice::Cloudflare secrets are not set yet, skipping deploy (see issue #6)."
            echo "ready=false" >> "$GITHUB_OUTPUT"
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@v4
        if: steps.secrets.outputs.ready == 'true'
      - uses: actions/setup-node@v4
        if: steps.secrets.outputs.ready == 'true'
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
        if: steps.secrets.outputs.ready == 'true'
      - run: npm run build
        if: steps.secrets.outputs.ready == 'true'

      - name: Deploy to production
        if: steps.secrets.outputs.ready == 'true' && github.event_name == 'push'
        run: npx --yes "wrangler@${WRANGLER_VERSION}" deploy

      - name: Upload preview version
        id: preview
        if: steps.secrets.outputs.ready == 'true' && github.event_name == 'pull_request'
        run: |
          npx --yes "wrangler@${WRANGLER_VERSION}" versions upload \
            --preview-alias "pr-${{ github.event.number }}" \
            --message "PR #${{ github.event.number }} @ ${GITHUB_SHA::7}" | tee wrangler.log
          alias_url=$(grep -oE 'https://pr-[^ ]+\.workers\.dev' wrangler.log | head -n1 || true)
          version_url=$(grep -oE 'https://[0-9a-f]{8}-[^ ]+\.workers\.dev' wrangler.log | head -n1 || true)
          echo "alias=${alias_url}" >> "$GITHUB_OUTPUT"
          echo "version=${version_url}" >> "$GITHUB_OUTPUT"

      - name: Comment preview URL on the PR
        if: steps.preview.outputs.alias != '' || steps.preview.outputs.version != ''
        uses: actions/github-script@v7
        env:
          ALIAS_URL: ${{ steps.preview.outputs.alias }}
          VERSION_URL: ${{ steps.preview.outputs.version }}
        with:
          script: |
            const marker = '<!-- preview-url -->';
            const lines = [marker, '**Preview**'];
            if (process.env.ALIAS_URL) lines.push(`- Latest for this PR: ${process.env.ALIAS_URL}`);
            if (process.env.VERSION_URL) lines.push(`- This commit (${context.sha.slice(0, 7)}): ${process.env.VERSION_URL}`);
            const body = lines.join('\n');
            const { owner, repo } = context.repo;
            const issue_number = context.issue.number;
            const comments = await github.paginate(github.rest.issues.listComments, { owner, repo, issue_number });
            const existing = comments.find((c) => c.body?.includes(marker));
            if (existing) await github.rest.issues.updateComment({ owner, repo, comment_id: existing.id, body });
            else await github.rest.issues.createComment({ owner, repo, issue_number, body });
